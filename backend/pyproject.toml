[project]
name = "app"
version = "0.1.0"
description = ""
requires-python = ">=3.15,<3.16"
dependencies = [
    "fastapi>=0.143.0,<1.0.0",
    "fastapi-cli>=0.0.32,<1.0.0",
    "uvicorn[standard]>=0.54.0,<1.0.0",
    "python-multipart>=0.0.32,<1.0.0",
    "email-validator>=2.3.0,<3.0.0",
    "pwdlib[argon2,bcrypt]>=0.3.1,<1.0.0",
    # Preserve passlib's legacy >72-byte verification; new hashes use Argon2.
    "bcrypt>=4.1.2,<5.0.0",
    "tenacity>=9.2.1,<10.0.0",
    "pydantic>=2.14.0,<3.0.0",
    "emails>=1.1.3,<2.0.0",
    "jinja2>=3.1.6,<4.0.0",
    "alembic>=1.20.0,<2.0.0",
    "httpx>=0.28.1,<1.0.0",
    "mwparserfromhell>=0.7.2,<0.8.0",
    "pillow>=12.3.0,<13.0.0",
    "psycopg[binary]>=3.3.6,<4.0.0",
    "sqlmodel>=0.0.48,<1.0.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "sentry-sdk[fastapi]>=2.71.0,<3.0.0",
    "pyjwt>=2.15.1,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "mypy>=2.4.0,<3.0.0",
    "ruff>=0.17.0,<1.0.0",
    "pre-commit>=4.6.2,<5.0.0",
    "coverage>=7.16.2,<8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[tool.ruff]
target-version = "py315"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true
