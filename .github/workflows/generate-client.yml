name: Generate Client

on:
  pull_request:
    types:
    - opened
    - synchronize

permissions:
  contents: read

jobs:
  generate-client:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: "26.11.1"
    - uses: actions/setup-python@v7.0.0
      with:
        python-version: "3.15"
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.2
      with:
        version: "0.13.0"
        enable-cache: true
    - name: Install dependencies
      run: npm ci
      working-directory: frontend
    - run: uv sync
      working-directory: backend
    - run: uv run bash scripts/generate-client.sh
      env:
        VIRTUAL_ENV: backend/.venv
        SECRET_KEY: just-for-generating-client
        POSTGRES_PASSWORD: just-for-generating-client
        FIRST_SUPERUSER_PASSWORD: just-for-generating-client
    - name: Check changes
      run: git diff --exit-code -- frontend/src/client frontend/openapi.json
