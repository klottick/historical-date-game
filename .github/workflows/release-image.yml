name: Publish tested amd64 release image

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: stable-image-publication-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Refresh stable release eligibility
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          version=$(python3 -m scripts.distribution.release check --repository "$GITHUB_REPOSITORY" --release-id "$RELEASE_ID" --expected-sha "$GITHUB_SHA")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.11.1'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.0'
      - name: Application static and frontend validation
        run: |
          install -d -m 0700 /tmp/opencode
          uv sync --frozen --project backend
          (cd backend && uv run bash scripts/lint.sh)
          npm ci --prefix frontend
          npm run lint --prefix frontend
          npm run typecheck --prefix frontend
          npm run test:unit --prefix frontend
          npm run build --prefix frontend
          PYTHONPATH=backend backend/.venv/bin/python -m unittest discover -s scripts/distribution/tests -v
          backend/.venv/bin/python scripts/test_workflow_contracts.py

  backend:
    needs: validate
    uses: ./.github/workflows/test-backend.yml

  image:
    needs: [validate, backend]
    uses: ./.github/workflows/test-distribution.yml
    with:
      release-version: ${{ needs.validate.outputs.version }}

  publish:
    needs: [validate, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-image
          path: ${{ runner.temp }}/tested-image
      - name: Publish the exact tested image with fresh guards
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: python3 -m scripts.distribution.publish --archive "$RUNNER_TEMP/tested-image/image.tar" --metadata "$RUNNER_TEMP/tested-image/image.json" --repository "$GITHUB_REPOSITORY" --release-id "$RELEASE_ID" --expected-sha "$GITHUB_SHA" --output "$RUNNER_TEMP/publication/publication.json"
      - name: Preserve partial or successful publication evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication/publication.json
          if-no-files-found: error
          retention-days: 30

  attach:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download same-run publication evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: publication-${{ github.run_id }}-*
          path: ${{ runner.temp }}/publication-attempts
      - name: Attach only the verified published version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          from scripts.distribution.publish import attach
          root=Path(os.environ['RUNNER_TEMP'])
          candidates=[]
          evidence=root/'publication-attempts'
          # A single matching artifact extracts at the root; multiple matches
          # extract under their artifact names. Inspect both without merging.
          for path in [*evidence.glob('publication.json'), *evidence.glob('*/publication.json')]:
              value=json.loads(path.read_bytes())
              if value.get('passed') is True:
                  if value.get('run_id') != os.environ['GITHUB_RUN_ID']:
                      raise SystemExit('Publication evidence belongs to a different run')
                  candidates.append(path)
          if len(candidates)!=1:
              raise SystemExit('Exactly one successful same-run publication required; inspect partial attempts')
          attach(candidates[0],os.environ['GITHUB_REPOSITORY'],int(os.environ['RELEASE_ID']),os.environ['GITHUB_SHA'],Path.cwd(),root/'install-assets')
          PY
      - name: Preserve generated install assets
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/install-assets
          retention-days: 30
