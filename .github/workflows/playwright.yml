name: Playwright Tests

on:
  push:
    branches:
    - main
  pull_request:
    types:
    - opened
    - synchronize
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: 'false'

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  changes:
    runs-on: ubuntu-latest
    # Set job outputs to values from filter step
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    # For pull requests it's not necessary to checkout the code but for the main branch it is
    - uses: dorny/paths-filter@v4.0.3
      id: filter
      with:
        filters: |
          changed:
            - backend/**
            - frontend/**
            - .env
            - docker-compose*.yml
            - compose.yaml
            - Dockerfile
            - scripts/distribution/**
            - .github/workflows/playwright.yml

  test-playwright:
    needs:
      - changes
    if: ${{ needs.changes.outputs.changed == 'true' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.override.yml
      POSTGRES_DB: historical_date_game_guest_fixture_test
      POSTGRES_SERVER: 127.0.0.1
      POSTGRES_PORT: "5433"
      ENVIRONMENT: local
      HDG_VERIFICATION_PROFILE: guest
      HDG_CI_DISPOSABLE: "true"
      COMPOSE_PROJECT_NAME: hdg-playwright-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shardIndex }}
    strategy:
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
      fail-fast: false
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: "26.11.1"
    - uses: actions/setup-python@v7.0.0
      with:
        python-version: "3.15"
    - name: Setup tmate session
      uses: mxschmitt/action-tmate@v3.24
      if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug_enabled == 'true' }}
      with:
        limit-access-to-actor: true
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.2
      with:
        version: "0.13.0"
        enable-cache: true
    - run: uv sync
      working-directory: backend
    - run: npm ci
      working-directory: frontend
    - run: uv run bash scripts/generate-client.sh
      env:
        VIRTUAL_ENV: backend/.venv
    - name: Check frontend
      run: |
        npm run lint
        npm run typecheck
        npm run test:unit
        npm run build
      working-directory: frontend
    - name: Configure disposable CI media mount
      run: |
        .venv/bin/python -m unittest tests.browser.test_ci_fixture
        .venv/bin/python -m tests.browser.ci_fixture configure --compose-override "$RUNNER_TEMP/playwright-compose.json"
        echo "COMPOSE_FILE=$GITHUB_WORKSPACE/docker-compose.yml:$GITHUB_WORKSPACE/docker-compose.override.yml:$RUNNER_TEMP/playwright-compose.json" >> "$GITHUB_ENV"
      working-directory: backend
    - run: docker compose build
    - name: Start only the disposable maintenance database
      run: docker compose up -d --wait db
    - name: Verify and activate synthetic browser catalog and public media
      run: .venv/bin/python -m tests.browser.ci_fixture prepare
      working-directory: backend
    - name: Wait for browser backend readiness
      run: docker compose up -d --wait backend mailcatcher
    - name: Run Playwright tests
      run: docker compose run --rm playwright npx playwright test --retries=0 --fail-on-flaky-tests --trace=retain-on-failure --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
    - name: Save service failure logs
      if: always()
      run: |
        mkdir -p frontend/service-diagnostics
        docker compose logs --no-color > frontend/service-diagnostics/service-logs.txt
    - run: docker compose down -v
      if: always()
    - name: Sanitize first-failure browser evidence
      id: sanitize
      if: always()
      run: python3 -m scripts.distribution.diagnostics --evidence frontend/blob-report --evidence frontend/test-results --evidence frontend/service-diagnostics --copy-to "$RUNNER_TEMP/playwright-diagnostics"
    - name: Upload service diagnostics
      if: ${{ always() && steps.sanitize.outcome == 'success' }}
      uses: actions/upload-artifact@v7.0.2
      with:
        name: playwright-service-logs-${{ matrix.shardIndex }}
        path: ${{ runner.temp }}/playwright-diagnostics/service-diagnostics
    - name: Upload sanitized first-failure diagnostics
      if: ${{ always() && steps.sanitize.outcome == 'success' }}
      uses: actions/upload-artifact@v7.0.2
      with:
        name: browser-diagnostics-${{ matrix.shardIndex }}
        path: ${{ runner.temp }}/playwright-diagnostics
        include-hidden-files: true
        retention-days: 1

  test-controlled-browser:
    needs:
      - changes
    if: ${{ needs.changes.outputs.changed == 'true' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      CI: "true"
      BOARD_TEST_EVIDENCE_DIR: ${{ github.workspace }}/frontend/test-results/board-evidence
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: "26.11.1"
    - run: npm ci
      working-directory: frontend
    - run: npx playwright install --with-deps chromium
      working-directory: frontend
    # Separate no-account configs own distinct ports (5186, 5194, 5185).
    # Sequential steps and distinct outputs: no fixture DB/SMTP/auth setup.
    - run: npx playwright test --config=playwright.board.config.ts --workers=1 --retries=0 --output=test-results/board --trace=retain-on-failure
      working-directory: frontend
    - run: npx playwright test --config=playwright.bootstrap.config.ts --workers=1 --retries=0 --output=test-results/bootstrap --trace=retain-on-failure
      if: ${{ !cancelled() }}
      working-directory: frontend
    - run: npx playwright test --config=playwright.identity.config.ts --workers=1 --retries=0 --output=test-results/identity --trace=retain-on-failure
      if: ${{ !cancelled() }}
      working-directory: frontend
    - name: Sanitize controlled harness diagnostics
      id: sanitize
      if: always()
      run: python3 -m scripts.distribution.diagnostics --evidence frontend/test-results
    - name: Upload controlled harness diagnostics
      if: ${{ always() && steps.sanitize.outcome == 'success' }}
      uses: actions/upload-artifact@v7.0.2
      with:
        name: controlled-browser-results
        path: frontend/test-results
        retention-days: 1

  # Diagnostic archives intentionally omit bodies, screenshots and arbitrary
  # evaluation values; they are not mergeable raw Playwright blob reports.
  # https://github.com/marketplace/actions/alls-green#why
  alls-green-playwright:  # This job does nothing and is only used for the branch protection
    if: always()
    needs:
      - test-playwright
      - test-controlled-browser
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: test-playwright, test-controlled-browser
