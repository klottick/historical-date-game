name: Lint Backend

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.15"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.0"
          enable-cache: true
      - run: uv run bash scripts/lint.sh
        working-directory: backend
      - name: Check publication workflow contracts
        run: uv run python ../scripts/test_workflow_contracts.py
        working-directory: backend
