name: Test Backend

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.override.yml
      HDG_VERIFICATION_PROFILE: lives
      POSTGRES_DB: historical_date_game_lives_backend_test
      POSTGRES_SERVER: "127.0.0.1"
      POSTGRES_PORT: "5433"
      ENVIRONMENT: local
      COMPOSE_PROJECT_NAME: hdg-backend-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.15"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
      - run: docker compose up -d --wait db mailcatcher
        env:
          # The test helper creates the absent target with its ownership comment.
          # Never let Compose initialize that target as an unowned database.
          POSTGRES_DB: postgres
      - name: Prepare owned backend and migration fixture databases
        run: uv run python -m tests.browser.ci_backend prepare
        working-directory: backend
      - name: Migrate DB
        run: uv run bash scripts/prestart.sh
        working-directory: backend
      - name: Run tests
        run: uv run bash scripts/tests-start.sh "Coverage for ${{ github.sha }}"
        working-directory: backend
      - name: Save service failure logs
        if: always()
        run: docker compose logs --no-color > backend-service-logs.txt
      - run: docker compose down -v
        if: always()
      - name: Store service diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: backend-service-logs
          path: backend-service-logs.txt
      - name: Store coverage files
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-html
          path: backend/htmlcov
          include-hidden-files: true
