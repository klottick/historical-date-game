name: Test Backend

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  test-backend:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: historical_date_game_guest_test
      POSTGRES_SERVER: "127.0.0.1"
      POSTGRES_PORT: "5433"
      ENVIRONMENT: local
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.15"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
      - run: docker compose down -v --remove-orphans
      - run: docker compose up -d --wait db mailcatcher
        env:
          # The test helper creates the absent target with its ownership comment.
          # Never let Compose initialize that target as an unowned database.
          POSTGRES_DB: postgres
      - name: Prepare owned disposable test DB
        run: uv run python -m tests.browser.guest_test_environment prepare-db --database "$POSTGRES_DB"
        working-directory: backend
      - name: Migrate DB
        run: uv run bash scripts/prestart.sh
        working-directory: backend
      - name: Run tests
        run: uv run bash scripts/tests-start.sh "Coverage for ${{ github.sha }}"
        working-directory: backend
      - run: docker compose down -v --remove-orphans
      - name: Store coverage files
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-html
          path: backend/htmlcov
          include-hidden-files: true
